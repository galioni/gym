<!DOCTYPE html>
<html lang="en" data-theme="apple-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Primary meta -->
    <meta name="description" content="Daily Grind — AI-powered workout tracker. Tell the AI your goals and get a personalised training plan built around your schedule, equipment, and experience." />
    <meta name="robots" content="index, follow" />

    <!-- Mobile / PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Daily Grind" />
    <meta name="theme-color" content="#F2F2F7" />
    <!-- Editorial (dark) theme webfonts: injected only when that theme is active; light uses the system font stack. -->
    <meta name="dg-dark-fonts" content="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=block" />
    <script>
      /* Light is the default. The Settings toggle owns the choice; ?theme=light|dark|system is a shortcut.
         Runs before paint to avoid a flash. Keep in sync with features/settings/theme/themePreference.ts. */
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("theme");
          if (q === "light" || q === "dark" || q === "system") localStorage.setItem("dg-theme", q);
          var pref = localStorage.getItem("dg-theme");
          if (pref === "system") pref = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if (pref !== "dark") return;
          document.documentElement.setAttribute("data-theme", "editorial-sport");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0f172a");
          document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute("content", "black-translucent");
          var link = document.createElement("link");
          link.id = "dg-fonts";
          link.rel = "stylesheet";
          link.href = document.querySelector('meta[name="dg-dark-fonts"]').getAttribute("content");
          document.head.appendChild(link);
        } catch (e) {}
      })();
    </script>
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- manifest injected by vite-plugin-pwa -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Daily Grind — AI Workout Tracker" />
    <meta property="og:description" content="AI-powered workout tracker. Tell the AI your goals and get a personalised training plan built around your schedule, equipment, and experience." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://gym-galioni.vercel.app" />
    <meta property="og:site_name" content="Daily Grind" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daily Grind — AI Workout Tracker" />
    <meta name="twitter:description" content="AI-powered workout tracker. Tell the AI your goals and get a personalised training plan." />
    <meta name="twitter:image" content="/og-image.png" />

    <title>Daily Grind — AI Workout Tracker</title>


    <link rel="stylesheet" href="./index.css" />
  </head>
  <body class="text-label antialiased selection:bg-primary selection:text-white">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
